# Client-only: без локальных движков (.mjs), без БД и каталога data.
# Сборка: npm run dist:client

appId: com.zernix.dungeonassistant.client
productName: ZERNIX Client
copyright: Copyright © 2026

directories:
  output: dist_electron_client

# Явные включения + исключения (electron-builder упакует зависимости из package.json вместе с масками)
files:
  - "**/*"
  - "!**/*.mjs"
  - "!**/*.db"
  - "!data/**/*"
  - "!data"
  - "!src/**/*"
  - "!tools/**/*"
  - "!npc-engine.mjs"
  - "!npc-data-expansion.mjs"
  - "!dist_electron/**/*"
  - "!dist_electron_client/**/*"
  - "!**/node_modules/better-sqlite3/**"
  - "!**/node_modules/express/**"

asarUnpack: []

extraResources: []

win:
  signAndEditExecutable: false
  target:
    - target: portable
      arch:
        - x64
